name: Validate and publish
on:
  push:
    branches: [main]
    paths:
      - "data/products.json"
      - "scripts/**"
      - "index.html"
      - ".github/workflows/validate-and-publish.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate verified records
        run: python scripts/validate.py
      - name: Write history
        run: python scripts/update.py
      - name: Commit generated history
        run: |
          git config user.name "conveni-fit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.json data/products.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: record validated product update [skip ci]"
            git push
          fi
